<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankSystem - Premium Banking Portal</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Secure, high-speed, institutional grade digital assets management and premium banking portal.">
    
    <!-- CDNs and Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Main Single Page Application Container -->
    <div id="app">
        <!-- Will be dynamically populated with either Landing/Login or Dashboard layouts by app.js -->
        <div style="height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px">
            <i class="fa fa-building-columns fa-spin" style="font-size:3rem; color:#3b82f6"></i>
            <span style="font-weight:600; color:#94a3b8; font-size:0.95rem; letter-spacing:1px; text-transform:uppercase">Initializing Banking Portal...</span>
        </div>
    </div>

    <!-- Modal Overlay System -->
    <div id="modal-overlay" class="modal-overlay hidden"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Core Script Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Custom SPA Logic -->
    <script src="/js/app.js"></script>
</body>
</html>
